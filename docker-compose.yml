services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openai-skills-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    # Use reload flag in compose for active development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
