services:
  api:
    image: ${DOCKERHUB_USERNAME}/openai-skills:latest
    container_name: openai-skills-api
    expose:
      - "8000"
    env_file:
      - .env
    restart: always


  nginx:
    image: nginx:alpine
    container_name: openai-skills-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: always
